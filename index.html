
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>КБЖУ Tracker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --blue: var(--tg-theme-button-color, #2481cc);
    --blue-text: var(--tg-theme-button-text-color, #fff);
    --bg: var(--tg-theme-bg-color, #f4f5f7);
    --card: var(--tg-theme-secondary-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #777);
    --line: rgba(128,128,128,.16);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 540px;
    margin: auto;
    padding: 18px 14px 90px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.logo-title {
    font-size: 24px;
    font-weight: 800;
}

.logo-sub {
    font-size: 13px;
    color: var(--hint);
    margin-top: 2px;
}

.profile-button {
    width: 42px;
    height: 42px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 0;
    background: var(--card);
    color: var(--text);
    font-size: 20px;
}

/* =========================
   CALORIE CARD
========================= */

.calorie-card {
    background: var(--card);
    border-radius: 24px;
    padding: 22px 18px 18px;
    margin-bottom: 13px;
}

.calorie-title {
    text-align: center;
    color: var(--hint);
    font-size: 14px;
}

.calorie-number {
    text-align: center;
    font-size: 42px;
    line-height: 1;
    font-weight: 850;
    margin-top: 8px;
}

.calorie-unit {
    text-align: center;
    font-size: 13px;
    color: var(--hint);
    margin-top: 6px;
}

.progress {
    height: 10px;
    border-radius: 20px;
    background: var(--bg);
    overflow: hidden;
    margin-top: 18px;
}

.progress-bar {
    height: 100%;
    width: 0;
    border-radius: 20px;
    background: var(--blue);
    transition: width .3s ease;
}

.calorie-bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: 12px;
    color: var(--hint);
}

/* =========================
   MACROS
========================= */

.macros-card {
    background: var(--card);
    border-radius: 20px;
    padding: 15px 10px;
    margin-bottom: 13px;
}

.macros-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
}

.macro-item {
    text-align: center;
    position: relative;
}

.macro-item + .macro-item::before {
    content: "";
    position: absolute;
    left: 0;
    top: 5px;
    bottom: 5px;
    width: 1px;
    background: var(--line);
}

.macro-name {
    font-size: 12px;
    color: var(--hint);
}

.macro-value {
    font-size: 20px;
    font-weight: 750;
    margin-top: 3px;
}

.macro-target {
    font-size: 11px;
    color: var(--hint);
    margin-top: 2px;
}

/* =========================
   SECTION
========================= */

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 2px 10px;
}

.section-title h2 {
    margin: 0;
    font-size: 19px;
}

.section-title span {
    font-size: 13px;
    color: var(--hint);
}

/* =========================
   MEALS
========================= */

.meals {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.meal-card {
    background: var(--card);
    border-radius: 17px;
    padding: 14px;
}

.meal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.meal-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.meal-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-size: 19px;
}

.meal-name {
    font-size: 15px;
    font-weight: 700;
}

.meal-cal {
    font-size: 13px;
    color: var(--hint);
    margin-top: 2px;
}

.meal-items {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
}

.meal-food {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 13px;
}

.meal-food-name {
    font-weight: 550;
}

.meal-food-info {
    color: var(--hint);
    white-space: nowrap;
}

.empty-meal {
    font-size: 13px;
    color: var(--hint);
    padding-top: 2px;
}

/* =========================
   ADD BUTTON
========================= */

.add-food-button {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 16px;

    width: calc(100% - 28px);
    max-width: 512px;

    border: 0;
    border-radius: 16px;

    padding: 15px;

    background: var(--blue);
    color: var(--blue-text);

    font-size: 16px;
    font-weight: 750;

    box-shadow: 0 6px 20px rgba(0,0,0,.18);

    z-index: 20;
}

.add-food-button:active {
    transform: translateX(-50%) scale(.98);
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.45);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px;

    z-index: 100;
}

.modal-box {
    width: 100%;
    max-width: 500px;

    max-height: 92vh;
    overflow-y: auto;

    background: var(--bg);

    border-radius: 22px;

    padding: 18px;

    box-shadow: 0 12px 45px rgba(0,0,0,.25);

    animation: modalIn .18s ease-out;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.close-button {
    width: 36px;
    height: 36px;

    padding: 0;
    margin: 0;

    border: 0;
    border-radius: 50%;

    background: var(--card);
    color: var(--text);

    font-size: 18px;
}

/* =========================
   FORM
========================= */

label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
}

input,
select {
    width: 100%;

    border: 0;
    outline: none;

    border-radius: 12px;

    padding: 13px;

    font-size: 16px;

    background: var(--card);
    color: var(--text);
}

input:focus,
select:focus {
    outline: 2px solid var(--blue);
    outline-offset: -2px;
}

button.main-button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 14px;
    margin-top: 13px;

    background: var(--blue);
    color: var(--blue-text);

    font-size: 16px;
    font-weight: 700;
}

.secondary-button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 13px;
    margin-top: 9px;

    background: transparent;
    color: var(--blue);

    font-size: 15px;
    font-weight: 650;
}

/* =========================
   CATEGORIES
========================= */

.categories {
    display: flex;
    gap: 7px;

    overflow-x: auto;

    padding: 2px 0 4px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    width: auto;

    margin: 0;
    padding: 9px 12px;

    white-space: nowrap;

    border: 0;
    border-radius: 11px;

    background: var(--card);
    color: var(--text);

    font-size: 13px;
}

.category.active {
    background: var(--blue);
    color: var(--blue-text);
}

/* =========================
   PRODUCTS
========================= */

.product-list {
    margin-top: 12px;
}

.product-option {
    padding: 12px;

    border-radius: 13px;

    background: var(--card);

    margin-bottom: 7px;

    cursor: pointer;
}

.product-option.selected {
    outline: 2px solid var(--blue);
}

.product-option b {
    display: block;
    font-size: 14px;
}

.product-option span {
    display: block;
    margin-top: 3px;

    font-size: 12px;

    color: var(--hint);
}

/* =========================
   GRAMS
========================= */

.grams-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.grams-buttons button {
    margin: 0;

    padding: 10px 4px;

    border: 0;
    border-radius: 11px;

    background: var(--card);
    color: var(--text);

    font-size: 13px;
}

.preview {
    margin-top: 10px;

    padding: 12px;

    border-radius: 12px;

    background: var(--card);

    text-align: center;

    font-size: 13px;
}

/* =========================
   MACRO FORM
========================= */

.macro-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
}

/* =========================
   PROFILE
========================= */

.profile-card {
    background: var(--card);
    border-radius: 18px;
    padding: 17px;
}

.profile-result {
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    background: var(--bg);
    text-align: center;
    font-size: 14px;
}

/* =========================
   ERRORS
========================= */

.error {
    color: #d93025;
    font-size: 13px;
    margin-top: 9px;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 360px) {

    .app {
        padding-left: 10px;
        padding-right: 10px;
    }

    .calorie-number {
        font-size: 38px;
    }

    .meal-card {
        padding: 12px;
    }

    .add-food-button {
        width: calc(100% - 20px);
    }

}
</style>
</head>

<div class="app">

    <!-- HEADER -->

    <header class="header">

            Поддержание
        </span>

    </div>


    <section
        class="meals"
        id="meals"
    ></section>


</div>


<!-- FIXED ADD BUTTON -->

<button

    id="openAddFood"
    type="button"
>
    ＋ Добавить еду
</button>


<!-- =========================

========================= -->

        ></div>


        <button
            class="main-button"
            id="calc"
            type="button"
        >
            Сохранить и рассчитать
        </button>

    </div>

</div>

        name: "Огурец",
        cat: "Овощи",
        kcal: 15,
        p: .8,
        f: .1,
        c: 2.5
    }

];


/* =========================
   STORAGE
========================= */

let custom = JSON.parse(
    localStorage.getItem("kbjuCustomProducts") || "[]"
);

let products = [
    ...baseProducts,
    ...custom
];

let profile = JSON.parse(
    localStorage.getItem("kbjuProfile") || "null"
);

let diary = JSON.parse(
    localStorage.getItem("kbjuDiary") || "null"
);


/* =========================
   DATE
========================= */

const today =
    new Date()
        .toISOString()
        .slice(0, 10);


if (!diary || diary.date !== today) {

    diary = {
        date: today,
        items: []
    };

}


/* =========================
   STATE
========================= */

let selected = null;

let category = "Все";


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(
        "kbjuProfile",
        JSON.stringify(profile)
    );

    localStorage.setItem(
        "kbjuDiary",
        JSON.stringify(diary)
    );

    localStorage.setItem(
        "kbjuCustomProducts",
        JSON.stringify(custom)
    );

}


/* =========================
   CALCULATE TARGETS
========================= */

function calcTargets() {

    let bmr =
        10 * profile.weight +
        6.25 * profile.height -
        5 * profile.age +
        (
            profile.gender === "male"
                ? 5
                : -161
        );


    let cal =
        bmr * profile.activity;


    if (profile.goal === "loss") {
        cal *= .85;
    }


    if (profile.goal === "gain") {
        cal *= 1.10;
    }


    cal = Math.round(cal);


    let p =
        Math.round(
            profile.weight * 2
        );


    let f =
        Math.round(
            profile.weight * .8
        );


    let c =
        Math.max(
            0,
            Math.round(
                (
                    cal -
                    p * 4 -
                    f * 9
                ) / 4
            )
        );


    return {
        cal,
        p,
        f,
        c
    };

}


/* =========================
   TOTALS
========================= */

function totals() {

    return diary.items.reduce(

        (a, x) => {

            a.cal += x.cal;
            a.p += x.p;
            a.f += x.f;
            a.c += x.c;

            return a;

        },

        {
            cal: 0,
            p: 0,
            f: 0,
            c: 0
        }

    );

}


/* =========================
   DATE TEXT
========================= */

function renderDate() {

    let date =
        new Date();

    let text =
        date.toLocaleDateString(
            "ru-RU",
            {
                day: "numeric",
                month: "long"
            }
        );

    $("dateText").textContent =
        "Сегодня, " + text;

}


/* =========================
   MEAL ICON
========================= */

function mealIcon(meal) {

    if (meal === "Завтрак") {
        return "🍳";
    }

    if (meal === "Обед") {
        return "🍲";
    }

    if (meal === "Ужин") {
        return "🌙";
    }

    return "🍎";

}


/* =========================
   RENDER MEALS
========================= */

function renderMeals() {

    let meals = [
        "Завтрак",
        "Обед",
        "Ужин",
        "Перекус"
    ];


    $("meals").innerHTML =
        meals.map(meal => {

            let items =
                diary.items.filter(
                    x => x.meal === meal
                );


            let calories =
                items.reduce(
                    (sum, x) =>
                        sum + x.cal,
                    0
                );


            let foodHtml =
                items.length

                    ?

                items.map(x => `

                    <div class="meal-food">

                        <span class="meal-food-name">
                            ${x.name} · ${x.grams} г
                        </span>

                        <span class="meal-food-info">
                            ${Math.round(x.cal)} ккал
                        </span>

                    </div>

                `).join("")

                    :

                `
                    <div class="empty-meal">
                        Пока ничего не добавлено
                    </div>
                `;


            return `

                <div class="meal-card">

                    <div class="meal-header">

                        <div class="meal-left">

                            <div class="meal-icon">
                                ${mealIcon(meal)}
                            </div>

                            <div>

                                <div class="meal-name">
                                    ${meal}
                                </div>

                                <div class="meal-cal">
                                    ${Math.round(calories)} ккал
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="meal-items">

                        ${foodHtml}

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   RENDER
========================= */

function render() {

    if (!profile) {

        openModal("profileModal");

        return;

    }


    let target =
        calcTargets();

    let eaten =
        totals();


    /* calories */

    let left =
        Math.max(
            0,
            Math.round(
                target.cal -
                eaten.cal
            )
        );


    $("leftCal").textContent =
        left;


    $("eatenCal").textContent =
        Math.round(
            eaten.cal
        );


    $("targetCal").textContent =
        target.cal;


    let percentage =
        target.cal > 0
            ? eaten.cal / target.cal * 100
            : 0;


    $("calBar").style.width =
        Math.min(
            100,
            percentage
        ) + "%";


    /* macros */

    $("leftP").textContent =
        Math.max(
            0,
            Math.round(
                target.p - eaten.p
            )
        );


    $("leftF").textContent =
        Math.max(
            0,
            Math.round(
                target.f - eaten.f
            )
        );


    $("leftC").textContent =
        Math.max(
            0,
            Math.round(
                target.c - eaten.c
            )
        );


    $("targetP").textContent =
        target.p;


    $("targetF").textContent =
        target.f;


    $("targetC").textContent =
        target.c;


    /* goal */

    $("goalText").textContent =

        profile.goal === "loss"

            ? "Похудение"

            :

        profile.goal === "gain"

            ? "Набор массы"

            :

        "Поддержание";


    renderMeals();

}


/* =========================
   MODAL FUNCTIONS
========================= */

function openModal(id) {

    $(id)
        .classList
        .remove("hidden");

}


function closeModal(id) {

    $(id)
        .classList
        .add("hidden");

}


/* =========================
   CLOSE MODALS ON BACKGROUND
========================= */

document
    .querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {

                    modal
                        .classList
                        .add("hidden");

                }

            }
        );

    });


/* =========================
   CLOSE BUTTONS
========================= */

$("closeAddModal").onclick =
    () => closeModal("addModal");


$("closeProductModal").onclick =
    () => closeModal("productModal");


$("closeProfileModal").onclick =
    () => closeModal("profileModal");


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            document
                .querySelectorAll(".modal")
                .forEach(modal =>
                    modal
                        .classList
                        .add("hidden")
                );

        }

    }
);


/* =========================
   PROFILE
========================= */

$("profileButton").onclick =
    () => {

        if (profile) {

            $("gender").value =
                profile.gender;

            $("age").value =
                profile.age;

            $("height").value =
                profile.height;

            $("weight").value =
                profile.weight;

            $("activity").value =
                profile.activity;

            $("goal").value =
                profile.goal;

        }

        openModal("profileModal");

    };


/* =========================
   SAVE PROFILE
========================= */

$("calc").onclick = () => {

    let age =
        +$("age").value;

    let height =
        +$("height").value;

    let weight =
        +$("weight").value;


    if (
        !age ||
        !height ||
        !weight
    ) {

        $("profileError").textContent =
            "Заполни возраст, рост и вес.";

        return;

    }


    profile = {

        gender:
            $("gender").value,

        age,

        height,

        weight,

        activity:
            +$("activity").value,

        goal:
            $("goal").value

    };


    save();


    $("profileError").textContent =
        "";


    closeModal(
        "profileModal"
    );


    render();

};


/* =========================
   OPEN ADD FOOD
========================= */

$("openAddFood").onclick = () => {

    openModal("addModal");

    renderCategories();

    renderProducts();

};


/* =========================
   CATEGORIES
========================= */

function renderCategories() {

    let cats = [
        "Все",
        ...new Set(
            products.map(
                p => p.cat
            )
        )
    ];


    $("categories").innerHTML =
        cats.map(c => `

            <button
                class="category ${
                    c === category
                        ? "active"
                        : ""
                }"
                data-cat="${c}"
                type="button"
            >
                ${c}
            </button>

        `).join("");


    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.onclick = () => {

                category =
                    button.dataset.cat;

                renderCategories();

                renderProducts();

            };

        });

}


/* =========================
   PRODUCTS
========================= */

function renderProducts() {

    let q =
        $("search")
            .value
            .trim()
            .toLowerCase();


    let list =
        products.filter(p =>

            (
                category === "Все" ||
                p.cat === category
            )

            &&

            p.name
                .toLowerCase()
                .includes(q)

        );


    $("productList").innerHTML =

        list.length

            ?

        list.map(p => `

            <div
                class="product-option ${
                    selected?.id === p.id
                        ? "selected"
                        : ""
                }"
                data-id="${p.id}"
            >

                <b>
                    ${p.name}
                </b>

                <span>
                    ${p.kcal} ккал ·
                    Б ${p.p} ·
                    Ж ${p.f} ·
                    У ${p.c}
                    на 100 г
                </span>

            </div>

        `).join("")

            :

        `
            <div class="hint">
                Ничего не найдено.
            </div>
        `;


    document
        .querySelectorAll(".product-option")
        .forEach(el => {

            el.onclick = () => {

                selected =
                    products.find(
                        p =>
                            p.id ==
                            el.dataset.id
                    );


                $("selectedBlock")
                    .classList
                    .remove("hidden");


                renderProducts();

                preview();

            };

        });

}


/* =========================
   SEARCH
========================= */

$("search").oninput =
    renderProducts;


/* =========================
   PREVIEW
========================= */

function preview() {

    if (!selected) {
        return;
    }


    let g =
        +$("grams").value || 0;


    $("preview").textContent =

        `${Math.round(
            selected.kcal *
            g / 100
        )} ккал · ` +

        `Б ${
            (
                selected.p *
                g /
                100
            ).toFixed(1)
        } г · ` +

        `Ж ${
            (
                selected.f *
                g /
                100
            ).toFixed(1)
        } г · ` +

        `У ${
            (
                selected.c *
                g /
                100
            ).toFixed(1)
        } г`;

}


$("grams").oninput =
    preview;


/* =========================
   QUICK GRAMS
========================= */

document
    .querySelectorAll("[data-g]")
    .forEach(button => {

        button.onclick = () => {

            $("grams").value =
                button.dataset.g;

            preview();

        };

    });


/* =========================
   ADD PRODUCT
========================= */

$("add").onclick = () => {

    if (!selected) {
        return;
    }


    let g =
        +$("grams").value;


    if (
        !g ||
        g <= 0
    ) {

        return;

    }


    diary.items.push({

        name:
            selected.name,

        meal:
            $("meal").value,

        grams:
            g,

        cal:
            selected.kcal *
            g /
            100,

        p:
            selected.p *
            g /
            100,

        f:
            selected.f *
            g /
            100,

        c:
            selected.c *
            g /
            100

    });


    save();


    closeModal(
        "addModal"
    );


    $("grams").value =
        100;


    selected = null;


    $("selectedBlock")
        .classList
        .add("hidden");


    $("search").value =
        "";


    category =
        "Все";


    render();

};


/* =========================
   CREATE PRODUCT
========================= */

$("newProduct").onclick = () => {

    closeModal(
        "addModal"
    );

    openModal(
        "productModal"
    );

};


/* =========================
   SAVE CUSTOM PRODUCT
========================= */

$("saveProduct").onclick = () => {

    let name =
        $("newName")
            .value
            .trim();


    let k =
        +$("newK").value;


    let p =
        +$("newP").value;


    let f =
        +$("newF").value;


    let c =
        +$("newC").value;


    if (
        !name ||
        k < 0 ||
        p < 0 ||
        f < 0 ||
        c < 0
    ) {

        $("newError").textContent =
            "Заполни все поля корректно.";

        return;

    }


    let item = {

        id:
            Date.now(),

        name,

        cat:
            $("newCat").value,

        kcal:
            k,

        p,

        f,

        c

    };


    custom.push(item);


    products = [
        ...baseProducts,
        ...custom
    ];


    save();


    /* очищаем */

    [
        "newName",
        "newK",
        "newP",
        "newF",
        "newC"
    ].forEach(id => {

        $(id).value = "";

    });


    $("newError").textContent =
        "";


    closeModal(
        "productModal"
    );


    /* открываем добавление */

    openModal(
        "addModal"
    );


    selected =
        item;


    $("selectedBlock")
        .classList
        .remove("hidden");


    renderCategories();

    renderProducts();

    preview();

};


/* =========================
   INIT
========================= */

renderDate();

render();

</script>

</body>
</html>

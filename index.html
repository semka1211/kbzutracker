
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>КБЖУ Tracker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;ф
}

:root {
    --blue: var(--tg-theme-button-color, #2481cc);
    --blue-text: var(--tg-theme-button-text-color, #fff);
    --bg: var(--tg-theme-bg-color, #f4f5f7);
    --card: var(--tg-theme-secondary-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #777);
    --line: rgba(128,128,128,.16);
    --danger: #e05252;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 540px;
    margin: auto;
    padding: 16px 14px 95px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.logo-title {
    font-size: 24px;
    font-weight: 800;
}

.logo-sub {
    margin-top: 2px;
    font-size: 13px;
    color: var(--hint);
}

.profile-button {
    width: 42px;
    height: 42px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--card);
    color: var(--text);
    font-size: 19px;
}

/* CALORIES */

.calorie-card {
    background: var(--card);
    border-radius: 24px;
    padding: 22px 18px 18px;
    margin-bottom: 12px;
}

.calorie-title {
    text-align: center;
    color: var(--hint);
    font-size: 14px;
}

.calorie-number {
    text-align: center;
    font-size: 42px;
    line-height: 1;
    font-weight: 850;
    margin-top: 8px;
}

.calorie-unit {
    text-align: center;
    font-size: 13px;
    color: var(--hint);
    margin-top: 6px;
}

.progress {
    height: 10px;
    border-radius: 20px;
    background: var(--bg);
    overflow: hidden;
    margin-top: 18px;
}

.progress-bar {
    height: 100%;
    width: 0;
    border-radius: 20px;
    background: var(--blue);
    transition: width .3s ease;
}

.calorie-bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: 12px;
    color: var(--hint);
}

/* MACROS */

.macros-card {
    background: var(--card);
    border-radius: 20px;
    padding: 15px 8px;
    margin-bottom: 15px;
}

.macros-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
}

.macro-item {
    text-align: center;
    position: relative;
}

.macro-item + .macro-item::before {
    content: "";
    position: absolute;
    left: 0;
    top: 5px;
    bottom: 5px;
    width: 1px;
    background: var(--line);
}

.macro-name {
    font-size: 12px;
    color: var(--hint);
}

.macro-value {
    font-size: 19px;
    font-weight: 750;
    margin-top: 3px;
}

.macro-target {
    font-size: 11px;
    color: var(--hint);
    margin-top: 2px;
}

/* SECTION */

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 19px 2px 10px;
}

.section-title h2 {
    margin: 0;
    font-size: 19px;
}

.section-title span {
    font-size: 13px;
    color: var(--hint);
}

/* MEALS */

.meals {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.meal-card {
    background: var(--card);
    border-radius: 17px;
    padding: 14px;
}

.meal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.meal-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.meal-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-size: 19px;
}

.meal-name {
    font-size: 15px;
    font-weight: 700;
}

.meal-cal {
    font-size: 13px;
    color: var(--hint);
    margin-top: 2px;
}

.meal-items {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
}

.meal-food {
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
}

.meal-food:last-child {
    border-bottom: 0;
}

.meal-food-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.meal-food-name {
    font-size: 13px;
    font-weight: 600;
}

.meal-food-cal {
    font-size: 12px;
    color: var(--hint);
    white-space: nowrap;
}

.meal-food-info {
    margin-top: 3px;
    font-size: 11px;
    color: var(--hint);
}

.delete-food {
    width: auto;
    margin: 5px 0 0;
    padding: 5px 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--danger);
    font-size: 12px;
}

.empty-meal {
    font-size: 13px;
    color: var(--hint);
    padding-top: 2px;
}

/* ADD BUTTON */

.add-food-button {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 15px;
    width: calc(100% - 28px);
    max-width: 512px;
    border: 0;
    border-radius: 16px;
    padding: 15px;
    background: var(--blue);
    color: var(--blue-text);
    font-size: 16px;
    font-weight: 750;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    z-index: 20;
}

.add-food-button:active {
    transform: translateX(-50%) scale(.98);
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 100;
}

.modal-box {
    width: 100%;
    max-width: 500px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 12px 45px rgba(0,0,0,.25);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.close-button {
    width: 36px;
    height: 36px;
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 50%;
    background: var(--card);
    color: var(--text);
    font-size: 17px;
}

/* FORM */

label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
}

input,
select {
    width: 100%;
    border: 0;
    outline: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    background: var(--card);
    color: var(--text);
}

button.main-button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 14px;
    margin-top: 13px;
    background: var(--blue);
    color: var(--blue-text);
    font-size: 16px;
    font-weight: 700;
}

.secondary-button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 13px;
    margin-top: 9px;
    background: transparent;
    color: var(--blue);
    font-size: 15px;
    font-weight: 650;
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 2px 0 4px;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    width: auto;
    margin: 0;
    padding: 9px 12px;
    white-space: nowrap;
    border: 0;
    border-radius: 11px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
}

.category.active {
    background: var(--blue);
    color: var(--blue-text);
}

/* PRODUCTS */

.product-list {
    margin-top: 12px;
}

.product-option {
    padding: 12px;
    border-radius: 13px;
    background: var(--card);
    margin-bottom: 7px;
    cursor: pointer;
}

.product-option.selected {
    outline: 2px solid var(--blue);
}

.product-option b {
    display: block;
    font-size: 14px;
}

.product-option span {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    color: var(--hint);
}

/* GRAMS */

.grams-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.grams-buttons button {
    margin: 0;
    padding: 10px 4px;
    border: 0;
    border-radius: 11px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
}

.preview {
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: var(--card);
    text-align: center;
    font-size: 13px;
}

/* NEW PRODUCT */

.macro-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
}

/* ERROR */

.error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 9px;
}

/* HINT */

.hint {
    color: var(--hint);
    font-size: 13px;
}

/* HIDDEN */

.hidden {
    display: none !important;
}

@media (max-width: 360px) {

    .app {
        padding-left: 10px;
        padding-right: 10px;
    }

    .calorie-number {
        font-size: 38px;
    }

    .add-food-button {
        width: calc(100% - 20px);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div>

            <div class="logo-title">
                КБЖУ Tracker 🥗
            </div>

            <div class="logo-sub" id="dateText">
                Сегодня
            </div>

        </div>

        <button
            class="profile-button"
            id="profileButton"
            type="button"
        >
            👤
        </button>

    </header>


    <!-- CALORIES -->

    <section class="calorie-card">

        <div class="calorie-title">
            Осталось сегодня
        </div>

        <div class="calorie-number" id="leftCal">
            0
        </div>

        <div class="calorie-unit">
            ккал
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="calBar"
            ></div>
        </div>

        <div class="calorie-bottom">

            <span>
                Съедено:
                <b id="eatenCal">0</b>
            </span>

            <span>
                Цель:
                <b id="targetCal">0</b>
            </span>

        </div>

    </section>


    <!-- MACROS -->

    <section class="macros-card">

        <div class="macros-grid">

            <div class="macro-item">

                <div class="macro-name">
                    Белки
                </div>

                <div class="macro-value">
                    <span id="eatenP">0</span> /
                    <span id="targetP">0</span> г
                </div>

                <div class="macro-target">
                    Осталось:
                    <span id="leftP">0</span> г
                </div>

            </div>


            <div class="macro-item">

                <div class="macro-name">
                    Жиры
                </div>

                <div class="macro-value">
                    <span id="eatenF">0</span> /
                    <span id="targetF">0</span> г
                </div>

                <div class="macro-target">
                    Осталось:
                    <span id="leftF">0</span> г
                </div>

            </div>


            <div class="macro-item">

                <div class="macro-name">
                    Углеводы
                </div>

                <div class="macro-value">
                    <span id="eatenC">0</span> /
                    <span id="targetC">0</span> г
                </div>

                <div class="macro-target">
                    Осталось:
                    <span id="leftC">0</span> г
                </div>

            </div>

        </div>

    </section>


    <!-- MEALS -->

    <div class="section-title">

        <h2>
            Сегодня 🍽
        </h2>

        <span id="goalText">
            Поддержание
        </span>

    </div>

    <section
        class="meals"
        id="meals"
    ></section>

</div>


<!-- ADD FOOD -->

<button
    class="add-food-button"
    id="openAddFood"
    type="button"
>
    ＋ Добавить еду
</button>


<!-- ADD FOOD MODAL -->

<div
    class="modal hidden"
    id="addModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Добавить еду
            </h2>

            <button
                class="close-button"
                id="closeAddModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <label>
            Приём пищи
        </label>

        <select id="meal">

            <option>Завтрак</option>
            <option>Обед</option>
            <option>Ужин</option>
            <option>Перекус</option>

        </select>


        <label>
            Поиск продукта
        </label>

        <input
            id="search"
            type="search"
            placeholder="Например, курица"
        >


        <label>
            Категория
        </label>

        <div
            class="categories"
            id="categories"
        ></div>


        <div
            class="product-list"
            id="productList"
        ></div>


        <div
            id="selectedBlock"
            class="hidden"
        >

            <label>
                Количество, г
            </label>

            <div class="grams-buttons">

                <button
                    data-g="50"
                    type="button"
                >
                    50
                </button>

                <button
                    data-g="100"
                    type="button"
                >
                    100
                </button>

                <button
                    data-g="150"
                    type="button"
                >
                    150
                </button>

                <button
                    data-g="200"
                    type="button"
                >
                    200
                </button>

            </div>


            <input
                id="grams"
                type="number"
                min="1"
                step="1"
                value="100"
            >


            <div
                class="preview"
                id="preview"
            ></div>


            <button
                class="main-button"
                id="add"
                type="button"
            >
                Добавить продукт
            </button>

        </div>


        <button
            class="secondary-button"
            id="newProduct"
            type="button"
        >
            ＋ Создать свой продукт
        </button>

    </div>

</div>


<!-- NEW PRODUCT -->

<div
    class="modal hidden"
    id="productModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Новый продукт
            </h2>

            <button
                class="close-button"
                id="closeProductModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <p class="hint">
            Укажи значения на 100 г продукта.
        </p>


        <label>
            Название
        </label>

        <input
            id="newName"
            placeholder="Например, протеин"
        >


        <label>
            Категория
        </label>

        <select id="newCat">

            <option>Другое</option>
            <option>Мясо</option>
            <option>Крупы</option>
            <option>Молочка</option>
            <option>Фрукты</option>
            <option>Овощи</option>

        </select>


        <div class="macro-inputs">

            <div>

                <label>
                    Калории
                </label>

                <input
                    id="newK"
                    type="number"
                    min="0"
                    step=".1"
                    placeholder="165"
                >

            </div>


            <div>

                <label>
                    Белки
                </label>

                <input
                    id="newP"
                    type="number"
                    min="0"
                    step=".1"
                    placeholder="31"
                >

            </div>


            <div>

                <label>
                    Жиры
                </label>

                <input
                    id="newF"
                    type="number"
                    min="0"
                    step=".1"
                    placeholder="3.6"
                >

            </div>


            <div>

                <label>
                    Углеводы
                </label>

                <input
                    id="newC"
                    type="number"
                    min="0"
                    step=".1"
                    placeholder="0"
                >

            </div>

        </div>


        <div
            class="error"
            id="newError"
        ></div>


        <button
            class="main-button"
            id="saveProduct"
            type="button"
        >
            Сохранить продукт
        </button>

    </div>

</div>


<!-- PROFILE -->

<div
    class="modal hidden"
    id="profileModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Профиль
            </h2>

            <button
                class="close-button"
                id="closeProfileModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <label>
            Пол
        </label>

        <select id="gender">

            <option value="male">
                Мужчина
            </option>

            <option value="female">
                Женщина
            </option>

        </select>


        <label>
            Возраст
        </label>

        <input
            id="age"
            type="number"
            min="14"
            max="100"
            placeholder="19"
        >


        <label>
            Рост, см
        </label>

        <input
            id="height"
            type="number"
            min="120"
            max="230"
            placeholder="180"
        >


        <label>
            Вес, кг
        </label>

        <input
            id="weight"
            type="number"
            min="30"
            max="250"
            step=".1"
            placeholder="60"
        >


        <label>
            Активность
        </label>

        <select id="activity">

            <option value="1.2">
                Минимальная
            </option>

            <option value="1.375">
                Лёгкая — 1–3 тренировки
            </option>

            <option value="1.55">
                Средняя — 3–5 тренировок
            </option>

            <option value="1.725">
                Высокая — 6–7 тренировок
            </option>

        </select>


        <label>
            Цель
        </label>

        <select id="goal">

            <option value="loss">
                Похудение
            </option>

            <option value="maintain">
                Поддержание
            </option>

            <option value="gain">
                Набор массы
            </option>

        </select>


        <div
            class="error"
            id="profileError"
        ></div>


        <button
            class="main-button"
            id="calc"
            type="button"
        >
            Сохранить и рассчитать
        </button>

    </div>

</div>

/* =========================================

const $ = id =>

/* =========================================
   STORAGE
========================================= */

function readStorage(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        return JSON.parse(value);

    } catch (error) {

        console.error(
            "Storage error:",
            error
        );

        return fallback;

    }

}


function writeStorage(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    } catch (error) {

        console.error(
            "Storage save error:",
            error
        );

    }

}


/* =========================================
   STATE
========================================= */

let custom =
    readStorage(
        "kbjuCustomProducts",
        []
    );

let products = [
    ...baseProducts,
    ...custom
];


let profile =
    readStorage(
        "kbjuProfile",
        null
    );


let diary =
    readStorage(
        "kbjuDiary",
        null
    );


const today =
    new Date()
        .toISOString()
        .slice(0, 10);


if (
    !diary ||
    diary.date !== today ||
    !Array.isArray(diary.items)
) {

    diary = {
        date: today,
        items: []
    };

}


let selected = null;

let category = "Все";


/* =========================================
   SAVE EVERYTHING
========================================= */

function save() {

    writeStorage(
        "kbjuProfile",
        profile
    );

    writeStorage(
        "kbjuDiary",
        diary
    );

    writeStorage(
        "kbjuCustomProducts",
        custom
    );

}


/* =========================================
   TARGETS
========================================= */

function calcTargets() {

    if (!profile) {

        return {
            cal: 0,
            p: 0,
            f: 0,
            c: 0
        };

    }


    let bmr =
        10 * Number(profile.weight) +
        6.25 * Number(profile.height) -
        5 * Number(profile.age) +
        (
            profile.gender === "male"
                ? 5
                : -161
        );


    let cal =
        bmr *
        Number(profile.activity);


    if (profile.goal === "loss") {
        cal *= 0.85;
    }

    if (profile.goal === "gain") {
        cal *= 1.10;
    }


    cal = Math.round(cal);


    const p =
        Math.round(
            Number(profile.weight) * 2
        );


    const f =
        Math.round(
            Number(profile.weight) * 0.8
        );


    const c =
        Math.max(
            0,
            Math.round(
                (
                    cal -
                    p * 4 -
                    f * 9
                ) / 4
            )
        );


    return {
        cal,
        p,
        f,
        c
    };

}


/* =========================================
   TOTALS
========================================= */

function totals() {

    return diary.items.reduce(

        (result, item) => {

            result.cal += Number(item.cal) || 0;

            result.p += Number(item.p) || 0;

            result.f += Number(item.f) || 0;

            result.c += Number(item.c) || 0;

            return result;

        },

        {
            cal: 0,
            p: 0,
            f: 0,
            c: 0
        }

    );

}


/* =========================================
   DATE
========================================= */

function renderDate() {

    const date =
        new Date();

    const text =
        date.toLocaleDateString(
            "ru-RU",
            {
                day: "numeric",
                month: "long"
            }
        );


    $("dateText").textContent =
        "Сегодня, " + text;

}


/* =========================================
   MEAL ICON
========================================= */

function mealIcon(meal) {

    if (meal === "Завтрак") {
        return "🍳";
    }

    if (meal === "Обед") {
        return "🍲";
    }

    if (meal === "Ужин") {
        return "🌙";
    }

    return "🍎";

}


/* =========================================
   DELETE FOOD
========================================= */

function removeFood(index) {

    if (
        index < 0 ||
        index >= diary.items.length
    ) {
        return;
    }


    diary.items.splice(
        index,
        1
    );


    save();

    render();

}


/* =========================================
   RENDER MEALS
========================================= */

function renderMeals() {

    const meals = [
        "Завтрак",
        "Обед",
        "Ужин",
        "Перекус"
    ];


    $("meals").innerHTML =
        meals.map(meal => {

            const items =
                diary.items.filter(
                    item =>
                        item.meal === meal
                );


            const calories =
                items.reduce(
                    (sum, item) =>
                        sum +
                        Number(item.cal || 0),
                    0
                );


            const foodHtml =

                items.length

                    ?

                items.map(item => {

                    const index =
                        diary.items.indexOf(
                            item
                        );


                    return `

                        <div class="meal-food">

                            <div class="meal-food-top">

                                <span class="meal-food-name">
                                    ${escapeHtml(item.name)}
                                    ·
                                    ${Number(item.grams)} г
                                </span>

                                <span class="meal-food-cal">
                                    ${Math.round(
                                        Number(item.cal)
                                    )} ккал
                                </span>

                            </div>


                            <div class="meal-food-info">

                                Б ${Number(item.p).toFixed(1)} г ·
                                Ж ${Number(item.f).toFixed(1)} г ·
                                У ${Number(item.c).toFixed(1)} г

                            </div>


                            <button
                                class="delete-food"
                                type="button"
                                data-delete-index="${index}"
                            >
                                Удалить
                            </button>

                        </div>

                    `;

                }).join("")

                    :

                `
                    <div class="empty-meal">
                        Пока ничего не добавлено
                    </div>
                `;


            return `

                <div class="meal-card">

                    <div class="meal-header">

                        <div class="meal-left">

                            <div class="meal-icon">
                                ${mealIcon(meal)}
                            </div>

                            <div>

                                <div class="meal-name">
                                    ${meal}
                                </div>

                                <div class="meal-cal">
                                    ${Math.round(calories)} ккал
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="meal-items">

                        ${foodHtml}

                    </div>

                </div>

            `;

        }).join("");


    document
        .querySelectorAll(
            "[data-delete-index]"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset
                                .deleteIndex
                        );


                    removeFood(index);

                }
            );

        });

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   MAIN RENDER
========================================= */

function render() {

    if (!profile) {

        $("leftCal").textContent = "0";

        $("eatenCal").textContent = "0";

        $("targetCal").textContent = "0";

        $("eatenP").textContent = "0";

        $("eatenF").textContent = "0";

        $("eatenC").textContent = "0";

        $("targetP").textContent = "0";

        $("targetF").textContent = "0";

        $("targetC").textContent = "0";

        $("leftP").textContent = "0";

        $("leftF").textContent = "0";

        $("leftC").textContent = "0";

        $("calBar").style.width = "0%";

        openModal("profileModal");

        return;

    }


    const target =
        calcTargets();


    const eaten =
        totals();


    /* CALORIES */

    const leftCal =
        Math.max(
            0,
            Math.round(
                target.cal -
                eaten.cal
            )
        );


    $("leftCal").textContent =
        leftCal;


    $("eatenCal").textContent =
        Math.round(
            eaten.cal
        );


    $("targetCal").textContent =
        target.cal;


    const calPercent =
        target.cal > 0
            ? eaten.cal /
              target.cal *
              100
            : 0;


    $("calBar").style.width =
        Math.min(
            100,
            calPercent
        ) + "%";


    /* PROTEINS */

    $("eatenP").textContent =
        Math.round(
            eaten.p
        );


    $("targetP").textContent =
        target.p;


    $("leftP").textContent =
        Math.max(
            0,
            Math.round(
                target.p -
                eaten.p
            )
        );


    /* FATS */

    $("eatenF").textContent =
        Math.round(
            eaten.f
        );


    $("targetF").textContent =
        target.f;


    $("leftF").textContent =
        Math.max(
            0,
            Math.round(
                target.f -
                eaten.f
            )
        );


    /* CARBS */

    $("eatenC").textContent =
        Math.round(
            eaten.c
        );


    $("targetC").textContent =
        target.c;


    $("leftC").textContent =
        Math.max(
            0,
            Math.round(
                target.c -
                eaten.c
            )
        );


    /* GOAL */

    $("goalText").textContent =

        profile.goal === "loss"

            ? "Похудение"

            :

        profile.goal === "gain"

            ? "Набор массы"

            :

        "Поддержание";


    renderMeals();

}


/* =========================================
   MODALS
========================================= */

function openModal(id) {

    $(id)
        .classList
        .remove("hidden");

}


function closeModal(id) {

    $(id)
        .classList
        .add("hidden");

}


/* =========================================
   CLOSE BUTTONS
========================================= */

$("closeAddModal").onclick =
    () => closeModal("addModal");


$("closeProductModal").onclick =
    () => closeModal("productModal");


$("closeProfileModal").onclick =
    () => closeModal("profileModal");


/* =========================================
   CLOSE BY BACKGROUND
========================================= */

document
    .querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {

                    closeModal(
                        modal.id
                    );

                }

            }
        );

    });


/* =========================================
   PROFILE
========================================= */

$("profileButton").onclick = () => {

    if (profile) {

        $("gender").value =
            profile.gender;

        $("age").value =
            profile.age;

        $("height").value =
            profile.height;

        $("weight").value =
            profile.weight;

        $("activity").value =
            profile.activity;

        $("goal").value =
            profile.goal;

    }


    openModal(
        "profileModal"
    );

};


/* =========================================
   SAVE PROFILE
========================================= */

$("calc").onclick = () => {

    const age =
        Number(
            $("age").value
        );


    const height =
        Number(
            $("height").value
        );


    const weight =
        Number(
            $("weight").value
        );


    if (
        !age ||
        !height ||
        !weight
    ) {

        $("profileError").textContent =
            "Заполни возраст, рост и вес.";

        return;

    }


    profile = {

        gender:
            $("gender").value,

        age,

        height,

        weight,

        activity:
            Number(
                $("activity").value
            ),

        goal:
            $("goal").value

    };


    save();


    $("profileError").textContent =
        "";


    closeModal(
        "profileModal"
    );


    render();

};


/* =========================================
   OPEN ADD FOOD
========================================= */

$("openAddFood").onclick = () => {

    openModal(
        "addModal"
    );


    renderCategories();

    renderProducts();

};


/* =========================================
   CATEGORIES
========================================= */

function renderCategories() {

    const cats = [
        "Все",
        ...new Set(
            products.map(
                product =>
                    product.cat
            )
        )
    ];


    $("categories").innerHTML =
        cats.map(cat => `

            <button
                class="category ${
                    category === cat
                        ? "active"
                        : ""
                }"
                type="button"
                data-category="${escapeHtml(cat)}"
            >
                ${escapeHtml(cat)}
            </button>

        `).join("");


    document
        .querySelectorAll(
            "[data-category]"
        )
        .forEach(button => {

            button.onclick = () => {

                category =
                    button.dataset.category;

                renderCategories();

                renderProducts();

            };

        });

}


/* =========================================
   PRODUCTS
========================================= */

function renderProducts() {

    const query =
        $("search")
            .value
            .trim()
            .toLowerCase();


    const list =
        products.filter(product => {

            const categoryMatch =
                category === "Все" ||
                product.cat === category;


            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(query);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    $("productList").innerHTML =

        list.length

            ?

        list.map(product => `

            <div
                class="product-option ${
                    selected &&
                    selected.id === product.id
                        ? "selected"
                        : ""
                }"
                data-product-id="${product.id}"
            >

                <b>
                    ${escapeHtml(
                        product.name
                    )}
                </b>

                <span>
                    ${product.kcal} ккал ·
                    Б ${product.p} ·
                    Ж ${product.f} ·
                    У ${product.c}
                    на 100 г
                </span>

            </div>

        `).join("")

            :

        `
            <div class="hint">
                Ничего не найдено.
            </div>
        `;


    document
        .querySelectorAll(
            "[data-product-id]"
        )
        .forEach(element => {

            element.onclick = () => {

                const id =
                    Number(
                        element.dataset
                            .productId
                    );


                selected =
                    products.find(
                        product =>
                            product.id === id
                    );


                $("selectedBlock")
                    .classList
                    .remove("hidden");


                renderProducts();

                preview();

            };

        });

}


/* =========================================
   SEARCH
========================================= */

$("search").oninput =
    renderProducts;


/* =========================================
   PREVIEW
========================================= */

function preview() {

    if (!selected) {

        $("preview").textContent =
            "";

        return;

    }


    const grams =
        Number(
            $("grams").value
        ) || 0;


    const kcal =
        selected.kcal *
        grams /
        100;


    const p =
        selected.p *
        grams /
        100;


    const f =
        selected.f *
        grams /
        100;


    const c =
        selected.c *
        grams /
        100;


    $("preview").textContent =

        `${Math.round(kcal)} ккал · ` +

        `Б ${p.toFixed(1)} г · ` +

        `Ж ${f.toFixed(1)} г · ` +

        `У ${c.toFixed(1)} г`;

}


$("grams").oninput =
    preview;


/* =========================================
   QUICK GRAMS
========================================= */

document
    .querySelectorAll("[data-g]")
    .forEach(button => {

        button.onclick = () => {

            $("grams").value =
                button.dataset.g;

            preview();

        };

    });


/* =========================================
   ADD FOOD
========================================= */

$("add").onclick = () => {

    if (!selected) {

        return;

    }


    const grams =
        Number(
            $("grams").value
        );


    if (
        !grams ||
        grams <= 0
    ) {

        return;

    }


    const item = {

        id:
            Date.now() +
            Math.random(),

        name:
            selected.name,

        meal:
            $("meal").value,

        grams,

        cal:
            Number(
                selected.kcal
            ) *
            grams /
            100,

        p:
            Number(
                selected.p
            ) *
            grams /
            100,

        f:
            Number(
                selected.f
            ) *
            grams /
            100,

        c:
            Number(
                selected.c
            ) *
            grams /
            100

    };


    diary.items.push(
        item
    );


    save();


    /* RESET */

    selected = null;

    category = "Все";

    $("search").value = "";

    $("grams").value = "100";

    $("selectedBlock")
        .classList
        .add("hidden");


    closeModal(
        "addModal"
    );


    render();

};


/* =========================================
   NEW PRODUCT
========================================= */

$("newProduct").onclick = () => {

    closeModal(
        "addModal"
    );

    openModal(
        "productModal"
    );

};


/* =========================================
   SAVE NEW PRODUCT
========================================= */

$("saveProduct").onclick = () => {

    const name =
        $("newName")
            .value
            .trim();


    const kcal =
        Number(
            $("newK").value
        );


    const p =
        Number(
            $("newP").value
        );


    const f =
        Number(
            $("newF").value
        );


    const c =
        Number(
            $("newC").value
        );


    if (
        !name ||
        !Number.isFinite(kcal) ||
        !Number.isFinite(p) ||
        !Number.isFinite(f) ||
        !Number.isFinite(c) ||
        kcal < 0 ||
        p < 0 ||
        f < 0 ||
        c < 0
    ) {

        $("newError").textContent =
            "Заполни все поля корректно.";

        return;

    }


    const product = {

        id:
            Date.now(),

        name,

        cat:
            $("newCat").value,

        kcal,

        p,

        f,

        c

    };


    custom.push(
        product
    );


    products = [
        ...baseProducts,
        ...custom
    ];


    save();


    /* CLEAR */

    $("newName").value = "";

    $("newK").value = "";

    $("newP").value = "";

    $("newF").value = "";

    $("newC").value = "";

    $("newError").textContent = "";


    /* SELECT CREATED PRODUCT */

    selected =
        product;

    category =
        "Все";


    closeModal(
        "productModal"
    );


    openModal(
        "addModal"
    );


    $("selectedBlock")
        .classList
        .remove("hidden");


    renderCategories();

    renderProducts();

    preview();

};


/* =========================================
   ESCAPE
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            document
                .querySelectorAll(".modal")
                .forEach(modal => {

                    modal
                        .classList
                        .add("hidden");

                });

        }

    }
);


/* =========================================
   START
========================================= */

renderDate();

render();

</script>

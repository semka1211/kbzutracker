<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>КБЖУ Tracker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--tg-theme-bg-color,#f4f5f7);
    color:var(--tg-theme-text-color,#111);
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:540px;
    margin:auto;
    padding:16px 14px 95px;
}

/* ================= HEADER ================= */

.header{
    margin-bottom:18px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h1{
    font-size:28px;
    line-height:1.1;
    margin:0;
}

.header p{
    margin:6px 0 0;
    color:var(--tg-theme-hint-color,#777);
    font-size:14px;
}

/* ================= PAGES ================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= CARDS ================= */

.card{
    background:var(--tg-theme-secondary-bg-color,#fff);
    border-radius:20px;
    padding:17px;
    margin-bottom:13px;
}

.card-title{
    font-size:18px;
    font-weight:750;
    margin:0 0 14px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

/* ================= CALORIE CARD ================= */

.calorie-card{
    text-align:center;
    padding:22px 16px 18px;
}

.ring-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin:0 auto 15px;
}

.ring{
    width:100%;
    height:100%;
    transform:rotate(-90deg);
}

.ring-bg{
    fill:none;
    stroke:var(--tg-theme-bg-color,#e9ebef);
    stroke-width:15;
}

.ring-progress{
    fill:none;
    stroke:var(--tg-theme-button-color,#2481cc);
    stroke-width:15;
    stroke-linecap:round;
    stroke-dasharray:502.65;
    stroke-dashoffset:502.65;
    transition:.4s ease;
}

.ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.ring-left{
    font-size:34px;
    font-weight:800;
    line-height:1;
}

.ring-label{
    margin-top:6px;
    font-size:13px;
    color:var(--tg-theme-hint-color,#777);
}

.calorie-bottom{
    display:flex;
    justify-content:center;
    gap:18px;
    color:var(--tg-theme-hint-color,#777);
    font-size:13px;
}

/* ================= MACROS ================= */

.macros-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.macro-card{
    background:var(--tg-theme-bg-color,#f4f5f7);
    border-radius:16px;
    padding:12px 7px;
    text-align:center;
}

.macro-ring{
    width:70px;
    height:70px;
    margin:0 auto 7px;
    position:relative;
}

.macro-ring svg{
    width:100%;
    height:100%;
    transform:rotate(-90deg);
}

.macro-bg{
    fill:none;
    stroke:rgba(128,128,128,.15);
    stroke-width:7;
}

.macro-progress{
    fill:none;
    stroke:var(--tg-theme-button-color,#2481cc);
    stroke-width:7;
    stroke-linecap:round;
    stroke-dasharray:188.5;
    stroke-dashoffset:188.5;
    transition:.4s;
}

.macro-center{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:750;
    font-size:14px;
}

.macro-name{
    font-size:13px;
    color:var(--tg-theme-hint-color,#777);
}

.macro-eaten{
    font-size:12px;
    margin-top:3px;
}

/* ================= MEALS ================= */

.meal-card{
    background:var(--tg-theme-secondary-bg-color,#fff);
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

.meal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.meal-title{
    font-size:16px;
    font-weight:750;
}

.meal-cal{
    font-size:13px;
    color:var(--tg-theme-hint-color,#777);
}

.meal-empty{
    color:var(--tg-theme-hint-color,#777);
    font-size:13px;
    padding:4px 0;
}

.meal-food{
    padding:9px 0;
    border-top:1px solid rgba(128,128,128,.14);
}

.food-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.food-name{
    font-size:14px;
    font-weight:650;
}

.food-details{
    color:var(--tg-theme-hint-color,#777);
    font-size:12px;
    margin-top:3px;
}

.food-delete{
    border:0;
    background:transparent;
    color:#e05252;
    font-size:18px;
    padding:5px;
}

/* ================= ADD BUTTON ================= */

.big-add{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    background:var(--tg-theme-button-color,#2481cc);
    color:var(--tg-theme-button-text-color,#fff);
    font-weight:750;
    font-size:16px;
    margin-bottom:14px;
}

/* ================= SEARCH ================= */

.search-box{
    position:relative;
    margin-bottom:12px;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    border-radius:14px;
    padding:13px 14px;
    background:var(--tg-theme-bg-color,#f4f5f7);
    color:var(--tg-theme-text-color,#111);
}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:12px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.cat{
    flex-shrink:0;
    border:0;
    border-radius:20px;
    padding:8px 12px;
    background:var(--tg-theme-bg-color,#f4f5f7);
    color:var(--tg-theme-text-color,#111);
    font-size:13px;
}

.cat.active{
    background:var(--tg-theme-button-color,#2481cc);
    color:var(--tg-theme-button-text-color,#fff);
}

.product{
    padding:13px 0;
    border-bottom:1px solid rgba(128,128,128,.14);
}

.product:last-child{
    border-bottom:0;
}

.product-name{
    font-weight:700;
    font-size:15px;
}

.product-info{
    color:var(--tg-theme-hint-color,#777);
    font-size:12px;
    margin-top:4px;
}

.product-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-btn{
    border:0;
    background:transparent;
    padding:6px;
    font-size:20px;
}

/* ================= HISTORY ================= */

.history-item{
    padding:14px 0;
    border-bottom:1px solid rgba(128,128,128,.14);
}

.history-item:last-child{
    border-bottom:0;
}

.history-date{
    font-weight:750;
}

.history-info{
    margin-top:5px;
    color:var(--tg-theme-hint-color,#777);
    font-size:13px;
}

/* ================= PROFILE ================= */

label{
    display:block;
    color:var(--tg-theme-hint-color,#777);
    font-size:13px;
    margin:12px 0 6px;
}

input,
select{
    width:100%;
    border:0;
    outline:none;
    border-radius:13px;
    padding:13px;
    background:var(--tg-theme-bg-color,#f4f5f7);
    color:var(--tg-theme-text-color,#111);
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    margin-top:14px;
    background:var(--tg-theme-button-color,#2481cc);
    color:var(--tg-theme-button-text-color,#fff);
    font-weight:750;
}

.secondary-btn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
    background:transparent;
    color:var(--tg-theme-link-color,#2481cc);
}

.danger-btn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:13px;
    margin-top:10px;
    background:transparent;
    color:#e05252;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    display:flex;
    align-items:flex-end;
}

.modal.hidden{
    display:none;
}

.modal-box{
    width:100%;
    max-width:540px;
    margin:auto;
    background:var(--tg-theme-bg-color,#fff);
    border-radius:24px 24px 0 0;
    padding:20px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin:0;
}

.modal-close{
    border:0;
    background:transparent;
    color:var(--tg-theme-link-color,#2481cc);
    font-size:14px;
}

.selected-product{
    background:var(--tg-theme-bg-color,#f4f5f7);
    border-radius:14px;
    padding:12px;
    margin-top:10px;
}

.quick-grams{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:8px;
}

.quick-grams button{
    border:0;
    border-radius:11px;
    padding:10px 5px;
    background:var(--tg-theme-bg-color,#f4f5f7);
    color:var(--tg-theme-text-color,#111);
}

.preview{
    background:var(--tg-theme-bg-color,#f4f5f7);
    border-radius:13px;
    padding:12px;
    margin-top:10px;
    text-align:center;
    font-size:13px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    max-width:540px;
    margin:auto;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:var(--tg-theme-secondary-bg-color,#fff);
    border-top:1px solid rgba(128,128,128,.12);
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-btn{
    border:0;
    background:transparent;
    color:var(--tg-theme-hint-color,#777);
    padding:7px 2px;
    font-size:11px;
}

.nav-icon{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.nav-btn.active{
    color:var(--tg-theme-button-color,#2481cc);
    font-weight:700;
}

/* ================= UTIL ================= */

.hidden{
    display:none!important;
}

.hint{
    color:var(--tg-theme-hint-color,#777);
    font-size:13px;
}

.error{
    color:#d93025;
    font-size:13px;
    margin-top:8px;
}

.empty{
    text-align:center;
    padding:25px 10px;
    color:var(--tg-theme-hint-color,#777);
}

@media(max-width:360px){
    .app{
        padding-left:10px;
        padding-right:10px;
    }

    .header h1{
        font-size:25px;
    }

    .ring-wrap{
        width:165px;
        height:165px;
    }

    .ring-left{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= HOME ================= -->

    <div class="page active" id="page-home">

        <div class="header">
            <h1>КБЖУ Tracker 🥗</h1>
            <p id="homeDate">Сегодня</p>
        </div>

        <div class="card calorie-card">

            <div class="ring-wrap">

                <svg class="ring" viewBox="0 0 180 180">

                    <circle
                        class="ring-bg"
                        cx="90"
                        cy="90"
                        r="80"
                    />

                    <circle
                        class="ring-progress"
                        id="calorieRing"
                        cx="90"
                        cy="90"
                        r="80"
                    />

                </svg>

                <div class="ring-center">

                    <div class="ring-left" id="leftCalories">
                        0
                    </div>

                    <div class="ring-label">
                        осталось ккал
                    </div>

                </div>

            </div>

            <div class="calorie-bottom">

                <span>
                    Съедено:
                    <b id="eatenCalories">0</b>
                </span>

                <span>
                    Цель:
                    <b id="targetCalories">0</b>
                </span>

            </div>

        </div>


        <!-- MACROS -->

        <div class="card">

            <div class="card-title">
                БЖУ
            </div>

            <div class="macros-grid">

                <div class="macro-card">

                    <div class="macro-ring">

                        <svg viewBox="0 0 70 70">

                            <circle
                                class="macro-bg"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                            <circle
                                class="macro-progress"
                                id="proteinRing"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                        </svg>

                        <div class="macro-center">
                            <span id="proteinPercent">0%</span>
                        </div>

                    </div>

                    <div class="macro-name">
                        Белки
                    </div>

                    <div class="macro-eaten">
                        <b id="eatenProtein">0</b> /
                        <span id="targetProtein">0</span> г
                    </div>

                </div>


                <div class="macro-card">

                    <div class="macro-ring">

                        <svg viewBox="0 0 70 70">

                            <circle
                                class="macro-bg"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                            <circle
                                class="macro-progress"
                                id="fatRing"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                        </svg>

                        <div class="macro-center">
                            <span id="fatPercent">0%</span>
                        </div>

                    </div>

                    <div class="macro-name">
                        Жиры
                    </div>

                    <div class="macro-eaten">
                        <b id="eatenFat">0</b> /
                        <span id="targetFat">0</span> г
                    </div>

                </div>


                <div class="macro-card">

                    <div class="macro-ring">

                        <svg viewBox="0 0 70 70">

                            <circle
                                class="macro-bg"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                            <circle
                                class="macro-progress"
                                id="carbRing"
                                cx="35"
                                cy="35"
                                r="30"
                            />

                        </svg>

                        <div class="macro-center">
                            <span id="carbPercent">0%</span>
                        </div>

                    </div>

                    <div class="macro-name">
                        Углеводы
                    </div>

                    <div class="macro-eaten">
                        <b id="eatenCarbs">0</b> /
                        <span id="targetCarbs">0</span> г
                    </div>

                </div>

            </div>

        </div>


        <!-- QUICK ADD -->

        <button class="big-add" id="openQuickAdd">
            ＋ Добавить еду
        </button>


        <!-- MEALS -->

        <div class="card">

            <div class="card-title">
                Приёмы пищи
            </div>

            <div id="homeMeals"></div>

        </div>

    </div>


    <!-- ================= DIARY ================= -->

    <div class="page" id="page-diary">

        <div class="header">

            <h1>Дневник 🍽️</h1>

            <p id="diaryDate">
                Сегодня
            </p>

        </div>

        <div id="diaryContent"></div>

    </div>


    <!-- ================= PRODUCTS ================= -->

    <div class="page" id="page-products">

        <div class="header">

            <h1>Продукты 🥑</h1>

            <p>
                Найди продукт и добавь его в дневник
            </p>

        </div>


        <div class="card">

            <div class="search-box">

                <input
                    id="productSearch"
                    type="search"
                    placeholder="🔍  Поиск продукта..."
                >

            </div>

            <div
                class="categories"
                id="productCategories"
            ></div>

            <div id="productsList"></div>

        </div>

    </div>


    <!-- ================= PROFILE ================= -->

    <div class="page" id="page-profile">

        <div class="header">

            <h1>Профиль ⚙️</h1>

            <p>
                Настрой свои цели
            </p>

        </div>


        <div class="card">

            <div class="card-title">
                Параметры
            </div>

            <label>
                Пол
            </label>

            <select id="profileGender">

                <option value="male">
                    Мужчина
                </option>

                <option value="female">
                    Женщина
                </option>

            </select>


            <label>
                Возраст
            </label>

            <input
                id="profileAge"
                type="number"
                min="14"
                max="100"
            >


            <label>
                Рост, см
            </label>

            <input
                id="profileHeight"
                type="number"
                min="120"
                max="230"
            >


            <label>
                Вес, кг
            </label>

            <input
                id="profileWeight"
                type="number"
                min="30"
                max="250"
                step="0.1"
            >


            <label>
                Активность
            </label>

            <select id="profileActivity">

                <option value="1.2">
                    Минимальная
                </option>

                <option value="1.375">
                    Лёгкая — 1–3 тренировки
                </option>

                <option value="1.55">
                    Средняя — 3–5 тренировок
                </option>

                <option value="1.725">
                    Высокая — 6–7 тренировок
                </option>

            </select>


            <label>
                Цель
            </label>

            <select id="profileGoal">

                <option value="loss">
                    Похудение
                </option>

                <option value="maintain">
                    Поддержание
                </option>

                <option value="gain">
                    Набор массы
                </option>

            </select>


            <div
                class="error"
                id="profileError"
            ></div>


            <button
                class="primary-btn"
                id="saveProfile"
            >
                Сохранить профиль
            </button>

        </div>


        <div class="card">

            <div class="card-title">
                Данные
            </div>

            <button
                class="secondary-btn"
                id="showHistory"
            >
                📅 История питания
            </button>

            <button
                class="danger-btn"
                id="clearAllData"
            >
                🗑️ Сбросить все данные
            </button>

        </div>

    </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        data-page="home"
    >
        <span class="nav-icon">🏠</span>
        Главная
    </button>

    <button
        class="nav-btn"
        data-page="diary"
    >
        <span class="nav-icon">📖</span>
        Дневник
    </button>

    <button
        class="nav-btn"
        data-page="products"
    >
        <span class="nav-icon">🥑</span>
        Продукты
    </button>

    <button
        class="nav-btn"
        data-page="profile"
    >
        <span class="nav-icon">⚙️</span>
        Профиль
    </button>

</nav>


<!-- ================= ADD FOOD MODAL ================= -->

<div
    class="modal hidden"
    id="foodModal"
>

    <div class="modal-box">

        <div class="row">

            <h2 class="modal-title">
                Добавить еду
            </h2>

            <button
                class="modal-close"
                id="closeFoodModal"
            >
                Закрыть
            </button>

        </div>


        <label>
            Приём пищи
        </label>

        <select id="modalMeal">

            <option>
                Завтрак
            </option>

            <option>
                Обед
            </option>

            <option>
                Ужин
            </option>

            <option>
                Перекус
            </option>

        </select>


        <label>
            Поиск
        </label>

        <input
            id="modalSearch"
            type="search"
            placeholder="Например, курица"
        >


        <div
            class="categories"
            id="modalCategories"
        ></div>


        <div id="modalProducts"></div>


        <div
            id="selectedFoodBlock"
            class="hidden"
        >

            <div
                class="selected-product"
                id="selectedFoodInfo"
            ></div>


            <label>
                Количество, г
            </label>

            <div class="quick-grams">

                <button data-grams="50">
                    50
                </button>

                <button data-grams="100">
                    100
                </button>

                <button data-grams="150">
                    150
                </button>

                <button data-grams="200">
                    200
                </button>

            </div>


            <input
                id="modalGrams"
                type="number"
                value="100"
                min="1"
            >


            <div
                class="preview"
                id="modalPreview"
            ></div>


            <button
                class="primary-btn"
                id="addFoodButton"
            >
                Добавить в дневник
            </button>

        </div>

    </div>

</div>


<!-- ================= HISTORY MODAL ================= -->

<div
    class="modal hidden"
    id="historyModal"
>

    <div class="modal-box">

        <div class="row">

            <h2 class="modal-title">
                История
            </h2>

            <button
                class="modal-close"
                id="closeHistory"
            >
                Закрыть
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

const today = new Date()
    .toISOString()
    .slice(0,10);


/* =========================================================
   PRODUCTS
========================================================= */

const baseProducts = [

    {
        id:1,

/* =========================================================
   TARGET CALCULATION
========================================================= */

function calculateTargets(){

    if(!profile){
        return {
            cal:0,
            p:0,
            f:0,
            c:0
        };
    }

    const bmr =
        10 * profile.weight +
        6.25 * profile.height -
        5 * profile.age +
        (profile.gender === "male" ? 5 : -161);

    let cal =
        bmr * profile.activity;

    if(profile.goal === "loss"){
        cal *= .85;
    }

    if(profile.goal === "gain"){
        cal *= 1.10;
    }

    cal = Math.round(cal);

    /*
       Белок = 2 г на кг
       Жиры = 0.8 г на кг
       Остаток калорий = углеводы
    */

    const p =
        Math.round(profile.weight * 2);

    const f =
        Math.round(profile.weight * .8);

    const c =
        Math.max(
            0,
            Math.round(
                (cal - p * 4 - f * 9) / 4
            )
        );

    return {
        cal,
        p,
        f,
        c
    };
}


/* =========================================================
   TOTALS
========================================================= */

function getTotals(){

    return diary.items.reduce(
        (total,item)=>{

            total.cal += Number(item.cal) || 0;
            total.p += Number(item.p) || 0;
            total.f += Number(item.f) || 0;
            total.c += Number(item.c) || 0;

            return total;

        },
        {
            cal:0,
            p:0,
            f:0,
            c:0
        }
    );
}


/* =========================================================
   RING
========================================================= */

function setRing(
    element,
    percent,
    circumference
){

    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );

    element.style.strokeDashoffset =
        circumference -
        circumference * percent / 100;
}

window.selectFood =
function(id){

    selectedProduct =
        products.find(
            product=>product.id===id
        );

        return;
    }

    $("selectedFoodBlock")
        .classList
        .remove("hidden");


    $("selectedFoodInfo").innerHTML = `

        <b>
            ${escapeHtml(selectedProduct.name)}
        </b>

        <div class="hint" style="margin-top:4px">
            ${selectedProduct.kcal} ккал ·
            Б ${selectedProduct.p} ·
            Ж ${selectedProduct.f} ·
            У ${selectedProduct.c}
            на 100 г
        </div>

    `;

    $("modalGrams").value = 100;

    updateModalPreview();

};


function updateModalPreview(){

    if(!selectedProduct){
        return;
    }

    const grams =
        Number(
            $("modalGrams").value
        ) || 0;


    const multiplier =
        grams / 100;


    const cal =
        selectedProduct.kcal *
        multiplier;

    const p =
        selectedProduct.p *
        multiplier;

    const f =
        selectedProduct.f *
        multiplier;

    const c =
        selectedProduct.c *
        multiplier;


    $("modalPreview").textContent =

        `${Math.round(cal)} ккал · ` +
        `Б ${p.toFixed(1)} г · ` +
        `Ж ${f.toFixed(1)} г · ` +
        `У ${c.toFixed(1)} г`;

}


function addSelectedFood(){

    if(!selectedProduct){
        return;
    }

    const grams =
        Number(
            $("modalGrams").value
        );


    if(!grams || grams <= 0){
        return;
    }


    const multiplier =
        grams / 100;


    diary.items.push({

        id:Date.now(),

        name:selectedProduct.name,

        meal:$("modalMeal").value,

        grams:grams,

        cal:
            selectedProduct.kcal *
            multiplier,

        p:
            selectedProduct.p *
            multiplier,

        f:
            selectedProduct.f *
            multiplier,

        c:
            selectedProduct.c *
            multiplier

    });


    save();

    closeFoodModal();

    renderAll();

}

        );


    const target =
        $("page-" + page);

    if(target){
        target.classList.add("active");
    }


    document
        .querySelectorAll(".nav-btn")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    if(page === "home"){
        renderHome();
    }

    if(page === "diary"){
        renderDiary();
    }

    if(page === "products"){
        renderProductsPage();
    }

    if(page === "profile"){
        loadProfileForm();
    }

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

    if(profile){

        renderHome();

        renderDiary();

    }

    renderProductsPage();

    loadProfileForm();

}


/* =========================================================
   DATE
========================================================= */

function formatDate(dateString){

    const date =
        new Date(
            dateString + "T00:00:00"
        );

    return date.toLocaleDateString(
        "ru-RU",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}


/* =========================================================
   EVENTS
========================================================= */


/* NAV */

document
    .querySelectorAll(".nav-btn")
    .forEach(button=>{

        button.onclick =
            () =>
                openPage(
                    button.dataset.page
                );

    });


/* QUICK ADD */

$("openQuickAdd").onclick =
    openFoodModal;


$("closeFoodModal").onclick =
    closeFoodModal;


/* SEARCH */

$("productSearch").oninput =
    renderProductsPage;


$("modalSearch").oninput =
    renderModalProducts;


/* GRAMS */

$("modalGrams").oninput =
    updateModalPreview;


/* QUICK GRAMS */

document
    .querySelectorAll(
        "[data-grams]"
    )
    .forEach(button=>{

        button.onclick = ()=>{

            $("modalGrams").value =
                button.dataset.grams;

            updateModalPreview();

        };

    });


/* ADD */

$("addFoodButton").onclick =
    addSelectedFood;


/* PROFILE */

$("saveProfile").onclick =
    saveProfile;


/* HISTORY */

$("showHistory").onclick =
    ()=>{

        $("historyModal")
            .classList
            .remove("hidden");

        renderHistory();

    };


$("closeHistory").onclick =
    ()=>{

        $("historyModal")
            .classList
            .add("hidden");

    };


/* CLEAR */

$("clearAllData").onclick =
    clearAllData;


/* =========================================================
   START
========================================================= */

$("homeDate").textContent =
    formatDate(today);

$("diaryDate").textContent =
    formatDate(today);


/*
   Если профиля ещё нет,
   открываем профиль.
*/

if(!profile){

    openPage("profile");

}else{

    renderAll();

}

</script>

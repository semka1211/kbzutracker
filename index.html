<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КБЖУ Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#111)}
.app{max-width:540px;margin:auto;padding:16px 14px 35px}
h1{font-size:28px;margin:4px 0 5px}.sub{margin:0 0 16px;color:var(--tg-theme-hint-color,#777)}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:18px;padding:17px;margin-bottom:13px}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--tg-theme-hint-color,#777);margin:11px 0 6px}
input,select{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#111);outline:none}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:13px;font-size:16px;font-weight:700;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
.secondary{background:transparent;color:var(--tg-theme-link-color,#2481cc)}
.summary{text-align:center}.cal{font-size:38px;font-weight:800}.hint{font-size:13px;color:var(--tg-theme-hint-color,#777)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.macro{background:var(--tg-theme-bg-color,#f4f5f7);padding:11px 4px;border-radius:13px;text-align:center}.macro b{font-size:18px}.macro small{display:block;color:var(--tg-theme-hint-color,#777);margin-top:3px}
.progress{height:9px;border-radius:20px;background:var(--tg-theme-bg-color,#eee);overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:var(--tg-theme-button-color,#2481cc);transition:.25s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.meal{padding:13px 0;border-bottom:1px solid rgba(128,128,128,.18)}.meal:last-child{border-bottom:0}.meal b{font-size:16px}.meal span{font-size:13px;color:var(--tg-theme-hint-color,#777)}
.food{padding:12px 0;border-bottom:1px solid rgba(128,128,128,.16)}.food:last-child{border-bottom:0}.food-name{font-weight:650}.food-info{font-size:13px;color:var(--tg-theme-hint-color,#777);margin-top:3px}.delete{width:auto;margin:0;padding:5px 9px;background:transparent;color:#e05252;font-size:13px}
.hidden{display:none}.error{color:#d93025;font-size:13px;margin-top:9px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--tg-theme-bg-color,#f1f1f1);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <h1>КБЖУ Tracker 🥗</h1>
  <p class="sub">Твой дневник питания</p>

  <section class="card" id="profileCard">
    <h2>Профиль</h2>
    <label>Пол</label><select id="gender"><option value="male">Мужчина</option><option value="female">Женщина</option></select>
    <label>Возраст</label><input id="age" type="number" min="14" max="100" placeholder="19">
    <label>Рост, см</label><input id="height" type="number" min="120" max="230" placeholder="180">
    <label>Вес, кг</label><input id="weight" type="number" min="30" max="250" step="0.1" placeholder="60">
    <label>Активность</label>
    <select id="activity">
      <option value="1.2">Минимальная</option><option value="1.375">Лёгкая — 1–3 тренировки</option>
      <option value="1.55">Средняя — 3–5 тренировок</option><option value="1.725">Высокая — 6–7 тренировок</option>
    </select>
    <label>Цель</label><select id="goal"><option value="loss">Похудение</option><option value="maintain">Поддержание</option><option value="gain">Набор массы</option></select>
    <div class="error" id="profileError"></div>
    <button id="calc">Рассчитать КБЖУ</button>
  </section>

  <section class="card hidden" id="summaryCard">
    <div class="summary">
      <div class="hint">Сегодня осталось</div>
      <div class="cal"><span id="leftCal">0</span> ккал</div>
      <div class="progress"><div class="bar" id="calBar"></div></div>
    </div>
    <div class="macros">
      <div class="macro"><b id="leftP">0</b><small>белки, г</small></div>
      <div class="macro"><b id="leftF">0</b><small>жиры, г</small></div>
      <div class="macro"><b id="leftC">0</b><small>углеводы, г</small></div>
    </div>
    <div style="margin-top:13px;text-align:center"><span class="tag" id="goalText"></span></div>
  </section>

  <section class="card hidden" id="diaryCard">
    <div class="row"><h2 style="margin:0">Сегодня 🍽</h2><span class="hint" id="eatenCal">0 ккал</span></div>
    <div id="meals"></div>
  </section>

  <section class="card hidden" id="addCard">
    <h2>Добавить продукт</h2>
    <label>Приём пищи</label>
    <select id="meal"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select>
    <label>Продукт</label>
    <select id="product"></select>
    <label>Количество, г</label>
    <input id="grams" type="number" min="1" step="1" value="100">
    <div class="hint" id="preview" style="margin-top:10px"></div>
    <button id="add">Добавить продукт</button>
  </section>

  <section class="card hidden" id="foodsCard">
    <h2>Съедено сегодня</h2>
    <div id="foods"></div>
    <button class="secondary" id="clearDay">Очистить дневник</button>
  </section>
</div>

<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);

const products=[
 {id:1,name:"Куриная грудка",kcal:165,p:31,f:3.6,c:0},
 {id:2,name:"Яйцо куриное",kcal:157,p:13,f:11,c:1.1},
 {id:3,name:"Рис варёный",kcal:130,p:2.7,f:.3,c:28},
 {id:4,name:"Гречка варёная",kcal:110,p:3.6,f:1.1,c:21.6},
 {id:5,name:"Овсянка на воде",kcal:68,p:2.4,f:1.4,c:12},
 {id:6,name:"Творог 5%",kcal:121,p:17.2,f:5,c:1.8},
 {id:7,name:"Банан",kcal:89,p:1.1,f:.3,c:22.8},
 {id:8,name:"Яблоко",kcal:52,p:.3,f:.2,c:13.8},
 {id:9,name:"Хлеб",kcal:250,p:8,f:3,c:49},
 {id:10,name:"Молоко 2.5%",kcal:52,p:2.8,f:2.5,c:4.7}
];

let profile=JSON.parse(localStorage.getItem("kbjuProfile")||"null");
let diary=JSON.parse(localStorage.getItem("kbjuDiary")||"null");
const today=new Date().toISOString().slice(0,10);
if(!diary||diary.date!==today) diary={date:today,items:[]};

products.forEach(p=>{let o=document.createElement("option");o.value=p.id;o.textContent=p.name;$("product").appendChild(o);});

function save(){localStorage.setItem("kbjuProfile",JSON.stringify(profile));localStorage.setItem("kbjuDiary",JSON.stringify(diary));}
function calcTargets(){
 let bmr=10*profile.weight+6.25*profile.height-5*profile.age+(profile.gender==="male"?5:-161);
 let cal=bmr*profile.activity;if(profile.goal==="loss")cal*=.85;if(profile.goal==="gain")cal*=1.10;
 cal=Math.round(cal);let p=Math.round(profile.weight*2),f=Math.round(profile.weight*.8),c=Math.max(0,Math.round((cal-p*4-f*9)/4));
 return {cal,p,f,c};
}
function totals(){return diary.items.reduce((a,x)=>{a.cal+=x.cal;a.p+=x.p;a.f+=x.f;a.c+=x.c;return a},{cal:0,p:0,f:0,c:0});}
function render(){
 if(!profile)return;
 $("summaryCard").classList.remove("hidden");$("diaryCard").classList.remove("hidden");$("addCard").classList.remove("hidden");$("foodsCard").classList.remove("hidden");
 const t=calcTargets(),e=totals();
 $("leftCal").textContent=Math.max(0,t.cal-e.cal);$("leftP").textContent=Math.max(0,Math.round(t.p-e.p));$("leftF").textContent=Math.max(0,Math.round(t.f-e.f));$("leftC").textContent=Math.max(0,Math.round(t.c-e.c));
 $("eatenCal").textContent=Math.round(e.cal)+" ккал";$("calBar").style.width=Math.min(100,e.cal/t.cal*100)+"%";
 $("goalText").textContent=profile.goal==="loss"?"Похудение":profile.goal==="gain"?"Набор массы":"Поддержание";
 const meals=["Завтрак","Обед","Ужин","Перекус"];
 $("meals").innerHTML=meals.map(m=>{let a=diary.items.filter(x=>x.meal===m).reduce((s,x)=>s+x.cal,0);return `<div class="meal"><div class="row"><b>${m}</b><span>${Math.round(a)} ккал</span></div></div>`}).join("");
 $("foods").innerHTML=diary.items.length?diary.items.map((x,i)=>`<div class="food"><div class="row"><div><div class="food-name">${x.name} — ${x.grams} г</div><div class="food-info">${Math.round(x.cal)} ккал · Б ${x.p.toFixed(1)} · Ж ${x.f.toFixed(1)} · У ${x.c.toFixed(1)} · ${x.meal}</div></div><button class="delete" onclick="removeFood(${i})">Удалить</button></div></div>`).join(""):"<div class='hint'>Пока ничего не добавлено.</div>";
}
function loadProfile(){
 if(!profile)return;
 $("gender").value=profile.gender;$("age").value=profile.age;$("height").value=profile.height;$("weight").value=profile.weight;$("activity").value=profile.activity;$("goal").value=profile.goal;
 render();
}
$("calc").onclick=()=>{
 const age=+$("age").value,height=+$("height").value,weight=+$("weight").value;
 if(!age||!height||!weight){$("profileError").textContent="Заполни возраст, рост и вес.";return;}
 profile={gender:$("gender").value,age,height,weight,activity:+$("activity").value,goal:$("goal").value};save();$("profileError").textContent="";render();
};
$("product").onchange=preview;$("grams").oninput=preview;
function preview(){let p=products.find(x=>x.id==+$("product").value),g=+$("grams").value||0;$("preview").textContent=`${Math.round(p.kcal*g/100)} ккал · Б ${(p.p*g/100).toFixed(1)} г · Ж ${(p.f*g/100).toFixed(1)} г · У ${(p.c*g/100).toFixed(1)} г`;}
$("add").onclick=()=>{
 let p=products.find(x=>x.id==+$("product").value),g=+$("grams").value;
 if(!g||g<=0)return;
 diary.items.push({name:p.name,meal:$("meal").value,grams:g,cal:p.kcal*g/100,p:p.p*g/100,f:p.f*g/100,c:p.c*g/100});
 save();render();$("grams").value=100;preview();
};
window.removeFood=i=>{diary.items.splice(i,1);save();render();};
$("clearDay").onclick=()=>{diary.items=[];save();render();};
loadProfile();preview();
</script>
</body>
</html>

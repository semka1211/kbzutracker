<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КБЖУ Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--tg-theme-bg-color, #f4f5f7);
            color: var(--tg-theme-text-color, #111);
        }
        .app { max-width: 520px; margin: 0 auto; padding: 18px 16px 30px; }
        .header { margin-bottom: 20px; }
        .header h1 { margin: 0 0 6px; font-size: 28px; }
        .header p { margin: 0; color: var(--tg-theme-hint-color, #777); }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .card h2 { margin: 0 0 15px; font-size: 19px; }
        label {
            display: block;
            margin: 12px 0 7px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #777);
        }
        input, select {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 16px;
            outline: none;
            background: var(--tg-theme-bg-color, #f4f5f7);
            color: var(--tg-theme-text-color, #111);
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 14px;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 700;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            cursor: pointer;
        }
        .result { display: none; }
        .calories {
            text-align: center;
            padding: 12px 0 18px;
        }
        .calories .number { font-size: 40px; font-weight: 800; }
        .calories .unit { color: var(--tg-theme-hint-color, #777); }
        .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
        .macro {
            text-align: center;
            padding: 13px 5px;
            border-radius: 14px;
            background: var(--tg-theme-bg-color, #f4f5f7);
        }
        .macro .value { font-size: 20px; font-weight: 800; }
        .macro .name { margin-top: 4px; font-size: 13px; color: var(--tg-theme-hint-color, #777); }
        .error {
            display: none;
            margin-top: 12px;
            color: #d93025;
            font-size: 14px;
        }
        .reset {
            background: transparent;
            color: var(--tg-theme-link-color, #2481cc);
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>КБЖУ Tracker 🥗</h1>
        <p>Рассчитай свою дневную норму</p>
    </div>

    <div class="card">
        <h2>Твои данные</h2>

        <label for="gender">Пол</label>
        <select id="gender">
            <option value="male">Мужчина</option>
            <option value="female">Женщина</option>
        </select>

        <label for="age">Возраст</label>
        <input id="age" type="number" min="14" max="100" placeholder="Например, 25">

        <label for="height">Рост, см</label>
        <input id="height" type="number" min="120" max="230" placeholder="Например, 180">

        <label for="weight">Вес, кг</label>
        <input id="weight" type="number" min="30" max="250" step="0.1" placeholder="Например, 75">

        <label for="activity">Активность</label>
        <select id="activity">
            <option value="1.2">Минимальная — почти нет спорта</option>
            <option value="1.375">Лёгкая — 1–3 тренировки/нед.</option>
            <option value="1.55">Средняя — 3–5 тренировок/нед.</option>
            <option value="1.725">Высокая — 6–7 тренировок/нед.</option>
            <option value="1.9">Очень высокая — тяжёлая физическая работа</option>
        </select>

        <label for="goal">Цель</label>
        <select id="goal">
            <option value="loss">Похудение</option>
            <option value="maintain">Поддержание</option>
            <option value="gain">Набор массы</option>
        </select>

        <div class="error" id="error">Заполни все поля корректно.</div>
        <button id="calculate">Рассчитать КБЖУ</button>
    </div>

    <div class="card result" id="result">
        <h2>Твоя дневная норма</h2>

        <div class="calories">
            <div class="number" id="calories">0</div>
            <div class="unit">ккал / день</div>
        </div>

        <div class="macros">
            <div class="macro">
                <div class="value" id="protein">0 г</div>
                <div class="name">Белки</div>
            </div>
            <div class="macro">
                <div class="value" id="fat">0 г</div>
                <div class="name">Жиры</div>
            </div>
            <div class="macro">
                <div class="value" id="carbs">0 г</div>
                <div class="name">Углеводы</div>
            </div>
        </div>

        <button class="reset" id="reset">Изменить данные</button>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const $ = id => document.getElementById(id);

    // Загружаем сохранённые данные
    const saved = JSON.parse(localStorage.getItem("kbjuProfile") || "null");
    if (saved) {
        $("gender").value = saved.gender || "male";
        $("age").value = saved.age || "";
        $("height").value = saved.height || "";
        $("weight").value = saved.weight || "";
        $("activity").value = saved.activity || "1.2";
        $("goal").value = saved.goal || "maintain";
    }

    function calculate() {
        const gender = $("gender").value;
        const age = Number($("age").value);
        const height = Number($("height").value);
        const weight = Number($("weight").value);
        const activity = Number($("activity").value);
        const goal = $("goal").value;

        if (!age || !height || !weight || age < 14 || height < 120 || weight < 30) {
            $("error").style.display = "block";
            $("result").style.display = "none";
            return;
        }

        $("error").style.display = "none";

        // Mifflin-St Jeor
        let bmr = 10 * weight + 6.25 * height - 5 * age;
        bmr += gender === "male" ? 5 : -161;

        let calories = bmr * activity;

        if (goal === "loss") calories *= 0.85;
        if (goal === "gain") calories *= 1.10;

        calories = Math.round(calories);

        // Простая стартовая схема макросов
        const protein = Math.round(weight * 2);
        const fat = Math.round(weight * 0.8);
        const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));

        $("calories").textContent = calories;
        $("protein").textContent = protein + " г";
        $("fat").textContent = fat + " г";
        $("carbs").textContent = carbs + " г";

        $("result").style.display = "block";

        localStorage.setItem("kbjuProfile", JSON.stringify({
            gender, age, height, weight, activity, goal
        }));

        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    $("calculate").addEventListener("click", calculate);

    $("reset").addEventListener("click", () => {
        $("result").style.display = "none";
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
</script>
</body>
</html>
